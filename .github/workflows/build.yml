name: Build Radio Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ARM GCC & Run Make
        uses: dillon-sm/arm-none-eabi-action@v1
        with:
          command: 'make'

      - name: Encrypt Firmware to .BTU
        shell: cmd
        run: |
          if exist .\build\firmware.hex (
            copy /Y .\build\firmware.hex .\firmware.hex
            .\Tools\ARCEncryptTools.exe .\firmware.hex QzBtDzKjYxGsWalkieTalkieBt8000OpenDate20241202
            if exist .\firmware.btu copy /Y .\firmware.btu .\RT900_MAIESQUE_CUSTOM.BTU
          )

      - name: Upload Compiled Firmware (.BTU) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT900_Bintolk_Custom_Firmware_BTU
          path: |
            *.btu
            *.BTU
            firmware.bin
