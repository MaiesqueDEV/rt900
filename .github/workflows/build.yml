name: Build Radio Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build Firmware
        run: make 2>&1 | tail -50

      - name: Show build result
        run: |
          if [ -f build/firmware.bin ]; then
            echo "BUILD OK - firmware.bin gerado"
            ls -lh build/firmware.bin
          else
            echo "BUILD FALHOU"
            exit 1
          fi

      - name: Encrypt to BTU (via mono)
        run: |
          sudo apt-get install -y mono-complete
          if [ -f build/firmware.hex ]; then
            cp build/firmware.hex ./firmware.hex
            mono ./Tools/ARCEncryptTools.exe ./firmware.hex QzBtDzKjYxGsWalkieTalkieBt8000OpenDate20241202 || true
            if [ -f firmware.btu ]; then
              cp firmware.btu RT900_MAIESQUE_CUSTOM.BTU
              echo "BTU gerado com sucesso"
            fi
          fi

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT900_MAIESQUE_CUSTOM
          path: |
            build/firmware.bin
            build/firmware.hex
            *.BTU
            *.btu
