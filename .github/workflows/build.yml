name: Build Radio Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build Firmware
        shell: bash
        run: make

      - name: Encrypt to BTU
        run: |
          sudo apt-get install -y mono-runtime
          mono ./Tools/ARCEncryptTools.exe ./build/firmware.hex QzBtDzKjYxGsWalkieTalkieBt8000OpenDate20241202 || true
          if [ -f firmware.btu ]; then
            mv firmware.btu RT900_MAIESQUE_CUSTOM.BTU
            echo "BTU gerado com sucesso!"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT900_MAIESQUE_CUSTOM
          path: |
            build/firmware.bin
            build/firmware.hex
            *.BTU
