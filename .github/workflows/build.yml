name: Build Radio Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build Firmware
        shell: bash
        run: |
          set -o pipefail
          make 2>&1 | tee build_log.txt || (tail -80 build_log.txt && exit 1)

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT900_MAIESQUE_CUSTOM
          path: |
            build/firmware.bin
            build/firmware.hex
