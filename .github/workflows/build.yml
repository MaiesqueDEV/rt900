name: Build Radio Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make mono-runtime

      - name: Build Firmware
        run: |
          make

      - name: Encrypt Firmware to .BTU
        run: |
          if [ -f build/firmware.hex ]; then
            cp build/firmware.hex ./firmware.hex
            mono ./Tools/ARCEncryptTools.exe ./firmware.hex QzBtDzKjYxGsWalkieTalkieBt8000OpenDate20241202
            if [ -f firmware.btu ]; then
              cp firmware.btu ./RT900_MAIESQUE_CUSTOM.BTU
            fi
          fi

      - name: Upload Compiled Firmware (.BTU) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RT900_Bintolk_Custom_Firmware_BTU
          path: |
            *.btu
            *.BTU
            firmware.bin
